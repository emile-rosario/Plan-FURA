[build]
publish = "frontend"
command = "echo 'Frontend es HTML estático - nada que buildear'"

[build.environment]
NODE_VERSION = "18"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[dev]
publish = "frontend"
