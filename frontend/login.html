<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acceso Cliente — Funerarias Rancier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--primary:#006ab4;--secondary:#00a9e1;--accent:#67ccdb}
    body{font-family:'DM Sans',sans-serif;background:linear-gradient(160deg,#ffffff 0%,#e8f4fd 100%);color:#333;min-height:100vh;display:flex;flex-direction:column}
    .serif{font-family:'Playfair Display',serif}
    .form-input{width:100%;background:#f0f8ff;border:1px solid #d0e8f5;color:#333;padding:.875rem 1rem;border-radius:6px;font-size:.875rem;transition:border-color .2s;font-family:'DM Sans',sans-serif;outline:none}
    .form-input:focus{border-color:var(--secondary);box-shadow:0 0 0 3px rgba(0,169,225,.1)}
    .form-input::placeholder{color:#999}
    .form-label{display:block;color:var(--primary);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.5rem;font-weight:600}
    .btn-primary{background:var(--secondary);color:#fff;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.75rem;padding:1rem 2rem;border-radius:6px;transition:all .3s;width:100%;cursor:pointer;border:none}
    .btn-primary:hover{background:var(--primary);box-shadow:0 8px 30px rgba(0,106,180,.3)}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none!important}
    .alert{padding:.875rem 1rem;border-radius:6px;font-size:.8rem;margin-bottom:1rem}
    .alert-error{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:#DC2626}
    .alert-success{background:rgba(0,169,225,.08);border:1px solid rgba(0,169,225,.2);color:var(--primary)}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    .shake{animation:shake .3s ease}
  </style>
</head>
<body>

<div class="p-6">
  <a href="index.html" class="flex items-center gap-2 text-gray-400 hover:text-primary transition-colors text-sm w-fit">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>Volver al inicio
  </a>
</div>

<main class="flex-1 flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-md">
    <div class="text-center mb-10">
      <a href="index.html" class="inline-flex items-center gap-3 mb-6">
        <div class="w-10 h-10 flex items-center justify-center rounded-lg" style="background:var(--primary)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M12 2L8 6H4v12l4 4h8l4-4V6h-4L12 2z"/></svg></div>
        <span class="serif font-semibold text-lg" style="color:var(--primary)">Funerarias <span style="color:var(--secondary)">Rancier</span></span>
      </a>
      <h1 class="serif text-3xl font-bold mb-1" style="color:var(--primary)">Acceso Cliente</h1>
      <p class="text-gray-500 text-sm">Ingresa con tu cuenta para gestionar tu plan</p>
    </div>

    <div class="border border-gray-200 rounded-xl p-8 bg-white shadow-sm">
      <div class="flex mb-8 border-b border-gray-200">
        <button id="tab-login" onclick="switchTab('login')" class="flex-1 pb-3 text-xs tracking-widest uppercase font-semibold transition-colors border-b-2 -mb-px" style="color:var(--primary);border-color:var(--secondary)">Iniciar Sesión</button>
        <button id="tab-register" onclick="switchTab('register')" class="flex-1 pb-3 text-xs tracking-widest uppercase font-semibold transition-colors border-b-2 -mb-px text-gray-400 border-transparent hover:text-primary">Registrarse</button>
      </div>

      <div id="alert" class="hidden"></div>

      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="space-y-5">
          <div><label class="form-label" for="login-email">Correo Electrónico</label><input id="login-email" type="email" class="form-input" placeholder="tu@correo.com" required autocomplete="email"/></div>
          <div><label class="form-label" for="login-pass">Contraseña</label>
            <div class="relative"><input id="login-pass" type="password" class="form-input pr-12" placeholder="••••••••" required autocomplete="current-password"/>
              <button type="button" onclick="togglePass('login-pass',this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary transition-colors"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <button type="submit" id="btn-login" class="btn-primary">Iniciar Sesión</button>
        </div>
      </form>

      <form id="form-register" class="hidden" onsubmit="handleRegister(event)">
        <div class="space-y-4">
          <div><label class="form-label">Nombre Completo</label><input id="reg-nombre" type="text" class="form-input" placeholder="Juan Pérez" required minlength="2"/></div>
          <div><label class="form-label">Correo Electrónico</label><input id="reg-email" type="email" class="form-input" placeholder="tu@correo.com" required/></div>
          <div><label class="form-label">Teléfono</label><input id="reg-telefono" type="tel" class="form-input" placeholder="(809) 564-2200" required/></div>
          <div><label class="form-label">Contraseña</label>
            <div class="relative"><input id="reg-pass" type="password" class="form-input pr-12" placeholder="Mínimo 8 caracteres" required minlength="8"/>
              <button type="button" onclick="togglePass('reg-pass',this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary transition-colors"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
            <p class="text-gray-400 text-xs mt-1">Debe contener letras y números</p>
          </div>
          <button type="submit" id="btn-register" class="btn-primary">Crear Cuenta</button>
        </div>
      </form>
    </div>

    <p class="text-center text-gray-400 text-xs mt-6 leading-relaxed">Al acceder, aceptas nuestros <a href="#" class="hover:underline" style="color:var(--secondary)">Términos de Servicio</a> y <a href="#" class="hover:underline" style="color:var(--secondary)">Política de Privacidad</a>.</p>
    <p class="text-center text-gray-400 text-xs mt-4">¿Necesitas ayuda? <a href="contacto.html" class="hover:underline" style="color:var(--secondary)">Contáctanos</a></p>
  </div>
</main>

<script src="assets/js/api.js"></script>
<script>
  if(Auth.isLoggedIn()) window.location.href='dashboard.html';
  function switchTab(tab){const isLogin=tab==='login';document.getElementById('form-login').classList.toggle('hidden',!isLogin);document.getElementById('form-register').classList.toggle('hidden',isLogin);document.getElementById('tab-login').style.cssText=isLogin?'color:var(--primary);border-color:var(--secondary)':'color:#9ca3af;border-color:transparent';document.getElementById('tab-register').style.cssText=!isLogin?'color:var(--primary);border-color:var(--secondary)':'color:#9ca3af;border-color:transparent';hideAlert();}
  function showAlert(msg,type='error'){const el=document.getElementById('alert');el.className=`alert ${type==='error'?'alert-error':'alert-success'}`;el.textContent=msg;el.classList.remove('hidden');if(type==='error'){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400);}}
  function hideAlert(){document.getElementById('alert').classList.add('hidden');}
  function togglePass(id){document.getElementById(id).type=document.getElementById(id).type==='password'?'text':'password';}
  async function handleLogin(e){e.preventDefault();hideAlert();const btn=document.getElementById('btn-login');UI.loading(btn,true,'Verificando...');const email=document.getElementById('login-email').value.trim(),password=document.getElementById('login-pass').value;const{ok,data}=await API.login({email,password});UI.loading(btn,false);if(ok){Auth.save(data.access_token,{id:data.user_id,nombre:data.user_name,email:data.user_email,rol:data.user_rol});showAlert('Bienvenido. Redirigiendo...','success');setTimeout(()=>window.location.href='dashboard.html',800);}else{showAlert(data?.detail||'Credenciales incorrectas.');}}
  async function handleRegister(e){e.preventDefault();hideAlert();const btn=document.getElementById('btn-register');UI.loading(btn,true,'Creando cuenta...');const payload={nombre:document.getElementById('reg-nombre').value.trim(),email:document.getElementById('reg-email').value.trim(),telefono:document.getElementById('reg-telefono').value.trim(),password:document.getElementById('reg-pass').value};const{ok,data}=await API.register(payload);UI.loading(btn,false);if(ok){showAlert('¡Cuenta creada! Ahora puedes iniciar sesión.','success');setTimeout(()=>switchTab('login'),1500);}else{const detail=data?.detail;showAlert(Array.isArray(detail)?detail.map(e=>e.msg).join('. '):(detail||'Error al crear la cuenta.'));}}
</script>
</body>
</html>
