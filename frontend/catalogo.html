<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>

  <meta name="description" content="Catálogo de ataúdes PlanFura — 5 modelos exclusivos de fabricación propia. Madera, metal y ecológicos."/>
  <meta property="og:title" content="Catálogo de Ataúdes — PlanFura"/>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    body{background:#fff}
    .product-card{transition:transform .3s,box-shadow .3s;cursor:pointer;border:1px solid #e0f0f8}
    .product-card:hover{transform:translateY(-6px);box-shadow:0 20px 50px rgba(0,106,180,.08)}
    .product-card:hover .card-cta{opacity:1;transform:translateY(0)}
    .card-cta{opacity:0;transform:translateY(8px);transition:all .25s}
    .filter-pill{padding:.4rem 1rem;border:1px solid #d0e8f5;border-radius:6px;color:#888;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .2s;background:white}
    .filter-pill.active,.filter-pill:hover{border-color:var(--secondary);color:var(--primary);background:rgba(103,204,219,.08)}
    #modal-overlay{transition:opacity .25s}
    #modal-box{transition:transform .3s,opacity .3s}

    /* ── Color swatches ── */
    .color-dot{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .2s,border-color .2s;flex-shrink:0}
    .color-dot:hover{transform:scale(1.2)}
    .color-dot.selected{border-color:#006ab4 !important;box-shadow:0 0 0 2px #fff,0 0 0 4px #006ab4}
    .color-dot-lg{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .2s,border-color .2s;flex-shrink:0}
    .color-dot-lg:hover{transform:scale(1.15)}
    .color-dot-lg.selected{border-color:#006ab4 !important;box-shadow:0 0 0 2px #fff,0 0 0 4px #006ab4}

    /* ── Image color transition ── */
    .ataud-img{transition:filter .45s ease,opacity .2s ease;width:100%;height:100%;object-fit:cover}
    .placeholder-icon{transition:color .45s ease}
  </style>
</head>
<body>

<!-- HEADER -->
<header class="fixed top-0 left-0 right-0 z-50 border-b border-gray-100" style="background:rgba(255,255,255,.95);backdrop-filter:blur(16px)">

      <a href="index.html" class="flex items-center gap-2 h-14">
        <img src="assets/img/Isotipo plan fura.png" alt="PlanFura" style="height:90px;"/>

          <span class="serif font-bold text-xl" style="color: var(--primary);">PlanFura</span>
        </div>
      </a>
      <nav class="hidden lg:flex items-center gap-8">
        <a href="index.html" class="nav-link">Inicio</a><a href="planes-funerarios.html" class="nav-link">Planes</a><a href="catalogo.html" class="nav-link active">Catálogo</a><a href="servicios.html" class="nav-link">Servicios</a><a href="contacto.html" class="nav-link">Contacto</a>
      </nav>
      <div class="hidden lg:flex gap-4">
        <a href="login.html" data-auth="login" class="btn-outline text-xs">Acceso Cliente</a>
        <a href="dashboard.html" data-auth="logout" class="hidden btn-primary text-xs">Mi Cuenta</a>
      </div>
    </div>
  </div>
</header>

<!-- PAGE HERO -->
<section class="pt-32 pb-14 text-center relative" style="background:linear-gradient(180deg,#ffffff 0%,#e8f4fd 100%)">
  <div class="max-w-2xl mx-auto px-6">
    <p class="text-xs tracking-[.3em] uppercase mb-4 font-semibold" style="color:var(--secondary)">Fabricación Propia</p>
    <h1 class="serif text-5xl lg:text-6xl font-bold mb-4" style="color:var(--primary)">Catálogo de Ataúdes</h1>
    <div class="blue-line w-24 mx-auto mb-5"></div>
    <p class="text-gray-500 text-sm">Somos fabricantes de ataúdes metálicos. 5 modelos exclusivos con la máxima calidad y durabilidad.</p>
  </div>
</section>

<!-- CATALOG -->
<section class="py-16 bg-white">
  <div class="max-w-7xl mx-auto px-6 lg:px-8">
    <div class="flex flex-col md:flex-row gap-4 justify-between items-start md:items-center mb-10">
      <div class="flex flex-wrap gap-2">
        <button class="filter-pill active" data-filter="all">Todos</button>
        <button class="filter-pill" data-filter="metal">Metal</button>
      </div>
      <select id="sort-select" class="hidden"></select>
    </div>
    <p class="text-gray-400 text-xs uppercase tracking-widest mb-8" id="count-label">Cargando...</p>

      <div class="col-span-3 flex justify-center py-16"><div class="w-10 h-10 border-2 border-blue-200 border-t-blue-500 rounded-full animate-spin"></div></div>
    </div>
  </div>
</section>

<!-- MODAL -->
<div id="modal-overlay" class="fixed inset-0 z-[100] flex items-center justify-center p-4 hidden" style="background:rgba(0,0,0,.5);backdrop-filter:blur(8px)">
  <div id="modal-box" class="max-w-2xl w-full border border-gray-200 rounded-xl relative overflow-hidden bg-white shadow-2xl">
    <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-primary z-10 p-2">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div id="modal-content" class="p-8"></div>
  </div>
</div>

</footer>

<script src="assets/js/api.js"></script>
<script>
/* ═══════════════════════════════════════
   PALETA DE COLORES — ataúdes metálicos
   Cada color aplica un CSS filter sobre
   la imagen base del modelo.
═══════════════════════════════════════ */
const COLORES_ATAUD = [
  { id:'dark',       nombre:'Dark',       hex:'#2d2d2d', filter:'grayscale(1) brightness(0.28)' },
  { id:'caoba',      nombre:'Caoba',      hex:'#6b2d0e', filter:'sepia(1) saturate(3.5) hue-rotate(340deg) brightness(0.65)' },
  { id:'corrugado',  nombre:'Corrugado',  hex:'#b0bec5', filter:'grayscale(0.6) brightness(1.15) saturate(0.4) hue-rotate(195deg)' },
  { id:'dorado',     nombre:'Dorado',     hex:'#b8860b', filter:'sepia(1) saturate(4) hue-rotate(5deg) brightness(1.05)' },
  { id:'blanco',     nombre:'Blanco',     hex:'#f0f0f0', filter:'grayscale(1) brightness(2.2) contrast(0.7)' },
];

/* Color e imagen activa por producto */
const selectedColors = {};
const activeSlide = {};  /* { productoId: 0|1 } */

function getColor(productId) {
  const id = selectedColors[productId] || 'dark';
  return COLORES_ATAUD.find(c => c.id === id) || COLORES_ATAUD[0];
}

function applyColorToImgs(productId, filter) {
  [0, 1].forEach(i => {
    const img = document.getElementById(`card-img-${productId}-${i}`);
    if (img) img.style.filter = filter;
  });
  const mImg = document.getElementById('modal-img');
  if (mImg && mImg.dataset.productId == productId) mImg.style.filter = filter;
}

function selectColor(productId, colorId, event) {
  if (event) event.stopPropagation();
  selectedColors[productId] = colorId;
  const color = COLORES_ATAUD.find(c => c.id === colorId);
  applyColorToImgs(productId, color.filter);

  document.querySelectorAll(`#card-dots-${productId} .color-dot`).forEach(dot =>
    dot.classList.toggle('selected', dot.dataset.colorId === colorId));

  const modalLabel = document.getElementById('modal-color-label');
  if (modalLabel && document.getElementById('modal-img')?.dataset.productId == productId) {
    modalLabel.textContent = color.nombre;
    document.querySelectorAll('#modal-color-dots .color-dot-lg').forEach(dot =>
      dot.classList.toggle('selected', dot.dataset.colorId === colorId));
  }
}

function switchSlide(productId, idx, event) {
  if (event) event.stopPropagation();
  activeSlide[productId] = idx;
  const color = getColor(productId);
  [0, 1].forEach(i => {
    const img = document.getElementById(`card-img-${productId}-${i}`);
    if (img) { img.classList.toggle('hidden', i !== idx); img.style.filter = color.filter; }
    const dot = document.getElementById(`slide-dot-${productId}-${i}`);
    if (dot) dot.classList.toggle('opacity-100', i === idx);
    if (dot) dot.classList.toggle('opacity-30', i !== idx);
  });
}

/* ═══════════════════════════════════════
   FILTROS Y ORDENADO
═══════════════════════════════════════ */
let allProducts = []; let activeFilter = 'all';
const materialGroups = { madera:['pino','caoba','cerezo','madera'], metal:['acero','bronce','metal'], eco:['bambú','bambu','ecológico','natural'] };
function matchFilter(c){ if(activeFilter==='all') return true; const mat=c.material.toLowerCase(); return(materialGroups[activeFilter]||[]).some(k=>mat.includes(k)); }
function sortProducts(products){ return[...products].sort((a,b)=>a.nombre.localeCompare(b.nombre)); }

/* ═══════════════════════════════════════
   RENDERIZAR TARJETAS
═══════════════════════════════════════ */
function renderProducts(){
  const filtered = sortProducts(allProducts.filter(matchFilter));
  const grid = document.getElementById('productos-grid');
  document.getElementById('count-label').textContent = `${filtered.length} producto${filtered.length!==1?'s':''} encontrado${filtered.length!==1?'s':''}`;
  if(!filtered.length){ grid.innerHTML=`<div class="col-span-3 py-12 text-center text-gray-500 text-sm">No hay productos en esta categoría.</div>`; return; }

  grid.innerHTML = filtered.map(c => {
    const color = getColor(c.id);
    const curColor = selectedColors[c.id] || 'dark';
    const swatches = COLORES_ATAUD.map(col => `
      <button class="color-dot${col.id === curColor ? ' selected':''}"
        style="background:${col.hex}" data-color-id="${col.id}"
        onclick="selectColor(${c.id},'${col.id}',event)" title="${col.nombre}"></button>`).join('');

    return `
    <div class="product-card rounded-xl overflow-hidden bg-white" onclick="openModal(${c.id})">
      <div class="relative h-56 flex items-center justify-center" style="background:linear-gradient(135deg,#e8f4fd,#d0ecf9)">
        ${c.imagen_url
          ? `<img id="card-img-${c.id}" src="${c.imagen_url}" alt="${c.nombre}" class="ataud-img" style="filter:${color.filter}"/>`
          : `<div class="flex flex-col items-center gap-2 opacity-30"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#006ab4" stroke-width="1"><path d="M12 2L8 6H4v12l4 4h8l4-4V6h-4L12 2z"/></svg></div>`}
        ${c.destacado ? `<span class="absolute top-3 left-3 text-white text-xs font-bold px-2 py-1 tracking-wider uppercase rounded" style="background:var(--secondary)">Destacado</span>` : ''}
        <div id="card-dots-${c.id}" class="absolute bottom-3 left-0 right-0 flex justify-center gap-2 px-4" onclick="event.stopPropagation()">${swatches}</div>
      </div>
      <div class="p-6">
        <p class="text-xs tracking-widest uppercase mb-1 font-semibold" style="color:var(--secondary)">${c.material}</p>
        <h3 class="serif text-lg font-semibold mb-2 leading-snug" style="color:var(--primary)">${c.nombre}</h3>
        ${c.descripcion ? `<p class="text-gray-500 text-xs leading-relaxed mb-3">${c.descripcion.slice(0,80)}...</p>` : ''}
        <div class="flex items-center justify-end mt-3">
          <button class="card-cta text-xs tracking-widest uppercase font-semibold pb-0.5" style="color:var(--secondary);border-bottom:2px solid rgba(0,169,225,.3)">Ver detalles →</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════
   MODAL CON SELECTOR DE COLOR
═══════════════════════════════════════ */
let modalSlide = 0;

function switchModalSlide(c, idx) {
  modalSlide = idx;
  const color = getColor(c.id);
  ['modal-img-0','modal-img-1'].forEach((imgId, i) => {
    const el = document.getElementById(imgId);
    if (!el) return;
    el.classList.toggle('hidden', i !== idx);
    el.style.filter = color.filter;
  });
  [0,1].forEach(i => {
    const d = document.getElementById(`modal-slide-dot-${i}`);
    if (d) { d.classList.toggle('opacity-100', i === idx); d.classList.toggle('opacity-30', i !== idx); }
  });
}

function openModal(id){
  const c = allProducts.find(p => p.id === id); if(!c) return;
  const color = getColor(c.id);
  const curColor = selectedColors[c.id] || 'dark';
  modalSlide = 0;

  const swatches = COLORES_ATAUD.map(col => `
    <button class="color-dot-lg${col.id === curColor ? ' selected':''}"
      style="background:${col.hex}" data-color-id="${col.id}"
      onclick="selectColor(${c.id},'${col.id}',event)" title="${col.nombre}">
    </button>`).join('');

  const hasTwo = !!c.imagen_url_2;
  const imgBlock = c.imagen_url ? `
    <img id="modal-img-0" data-product-id="${c.id}" src="${c.imagen_url}" alt="${c.nombre}" class="ataud-img" style="filter:${color.filter}"/>
    ${hasTwo ? `<img id="modal-img-1" data-product-id="${c.id}" src="${c.imagen_url_2}" alt="${c.nombre}" class="ataud-img hidden" style="filter:${color.filter}"/>` : ''}
  ` : `<div id="modal-img-0" data-product-id="${c.id}" class="opacity-20"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#006ab4" stroke-width="1" class="mx-auto"><path d="M12 2L8 6H4v12l4 4h8l4-4V6h-4L12 2z"/></svg></div>`;

  const slideNav = hasTwo ? `
    <div class="absolute top-1/2 -translate-y-1/2 left-2 right-2 flex justify-between">
      <button class="w-8 h-8 rounded-full bg-white/80 shadow flex items-center justify-center text-lg" onclick="switchModalSlide(allProducts.find(p=>p.id===${c.id}),0)">‹</button>
      <button class="w-8 h-8 rounded-full bg-white/80 shadow flex items-center justify-center text-lg" onclick="switchModalSlide(allProducts.find(p=>p.id===${c.id}),1)">›</button>
    </div>
    <div class="absolute bottom-3 left-0 right-0 flex justify-center gap-2">
      <span id="modal-slide-dot-0" class="w-2 h-2 rounded-full bg-blue-400 opacity-100"></span>
      <span id="modal-slide-dot-1" class="w-2 h-2 rounded-full bg-blue-400 opacity-30"></span>
    </div>` : '';

  document.getElementById('modal-content').innerHTML = `
    <div class="flex flex-col gap-4">
      <p class="text-xs tracking-widest uppercase font-semibold" style="color:var(--secondary)">${c.material}</p>
      <h2 class="serif text-2xl font-semibold" style="color:var(--primary)">${c.nombre}</h2>
      ${c.descripcion ? `<p class="text-gray-600 text-sm leading-relaxed">${c.descripcion}</p>` : ''}
      ${c.disponible
        ? `<a href="contacto.html?ataud=${encodeURIComponent(c.nombre)}" class="btn-primary text-center mt-2">Solicitar Información</a>`
        : `<div class="btn-outline opacity-50 cursor-not-allowed text-center mt-2">No Disponible</div>`}
    </div>`;

  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal(){ document.getElementById('modal-overlay').classList.add('hidden'); }
document.getElementById('modal-overlay').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
document.querySelectorAll('.filter-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); activeFilter = btn.dataset.filter; renderProducts();
  });
});
document.getElementById('sort-select').addEventListener('change', renderProducts);

async function init(){
  const { ok, data } = await API.getAtaudes();
  const products = data?.items ?? data;
  if(!ok || !products?.length){
    document.getElementById('count-label').textContent = '0 productos encontrados';
    document.getElementById('productos-grid').innerHTML=`
      <div class="col-span-3 py-20 text-center">
        <div class="w-16 h-16 mx-auto mb-6 rounded-full flex items-center justify-center" style="background:rgba(103,204,219,.12)">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#006ab4" stroke-width="1.5"><path d="M12 2L8 6H4v12l4 4h8l4-4V6h-4L12 2z"/></svg>
        </div>
        <p class="serif text-2xl font-semibold mb-2" style="color:var(--primary)">Catálogo no disponible</p>
        <p class="text-gray-500 text-sm mb-6">En este momento no hay productos en catálogo. Contáctanos para más información.</p>
        <a href="contacto.html" class="btn-primary">Contactar</a>
      </div>`;
    return;
  }
  allProducts = products;
  products.forEach(c => { selectedColors[c.id] = 'dark'; activeSlide[c.id] = 0; });
  renderProducts();
}
init();
</script>
</body>
